<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SkyHop 3D Obby</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#83d8ff;font-family:Arial;color:white;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#07182ddd;border:1px solid #8beaff88;border-radius:12px;padding:9px 12px;font-weight:bold;text-shadow:0 2px 5px #000}#brand{color:#8df1ff;letter-spacing:2px}#toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:1000;text-shadow:0 3px 12px #000;opacity:0;pointer-events:none}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 20px;pointer-events:none}#stick{width:126px;height:126px;border-radius:50%;background:#09284b99;border:2px solid #d4f7ff99;position:relative;pointer-events:auto}#nub{position:absolute;width:52px;height:52px;left:35px;top:35px;border-radius:50%;background:linear-gradient(#b9f6ff,#348bd6);border:2px solid white}#jump{pointer-events:auto;border:2px solid white;border-radius:50%;width:88px;height:88px;background:linear-gradient(#ffe27c,#ff8a35);font-weight:1000;color:#522600;font-size:16px;box-shadow:0 6px 0 #a54a1e}#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#06152bdc;z-index:4}#menu{width:min(440px,100%);padding:24px;text-align:center;background:#07182bf2;border:1px solid #8beaff88;border-radius:22px}h1{margin:0;color:#8df1ff;font-size:42px;letter-spacing:3px}p{color:#c9e3f5;line-height:1.5}#play{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#20c8e9,#6673ff);color:white;font-size:16px;font-weight:1000}
</style></head><body><div id="game"></div><div id="hud"><div class="pill"><div id="brand">SKYHOP 3D</div><small>MOBILE OBBY</small></div><div class="pill" id="stats">COINS 0<br>CHECKPOINT —</div></div><div id="toast"></div><div id="controls"><div id="stick"><div id="nub"></div></div><button id="jump">JUMP</button></div>
<div id="overlay"><div id="menu"><h1>SKYHOP 3D</h1><p>Jump across floating platforms, collect glowing coins and reach the portal. Don't fall!</p><p><b>CONTROLS</b><br>Drag joystick to move · Tap JUMP to leap</p><button id="play">START OBBY</button><p style="font-size:11px">A 3D mobile obstacle course</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id);if(!window.THREE){$('menu').innerHTML='<h1>3D ENGINE ERROR</h1><p>Three.js could not load. Check your internet connection and refresh.</p>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83d8ff);scene.fog=new THREE.Fog(0x83d8ff,35,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff8ff,0x456080,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-8,18,8);sun.castShadow=true;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.65});const platforms=[],coins=[],checkpoints=[];function platform(x,y,z,w,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.45,d),material(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);let rim=new THREE.Mesh(new THREE.BoxGeometry(w+.12,.12,d+.12),material(0x164b76));rim.position.set(x,y-.27,z);scene.add(rim);platforms.push({x,y,z,w,d})}
function coin(x,y,z){let m=new THREE.Mesh(new THREE.TorusGeometry(.34,.1,10,22),new THREE.MeshStandardMaterial({color:0xffd34d,emissive:0x986000,emissiveIntensity:1}));m.position.set(x,y,z);scene.add(m);coins.push({m,got:false})}
function checkpoint(x,y,z){let m=new THREE.Mesh(new THREE.TorusGeometry(.65,.09,10,28),new THREE.MeshStandardMaterial({color:0x65ffb5,emissive:0x087b4d,emissiveIntensity:1}));m.position.set(x,y+1,z);scene.add(m);checkpoints.push({x,y,z,m})}
platform(0,0,0,7,7,0x328dbd);platform(0,.3,-7,3.5,3.5,0x3b9fcb);coin(0,1.5,-7);platform(3,.8,-13,3,3,0x328fbd);coin(3,2,-13);platform(6,1.3,-19,3,3,0x438fc4);platform(6,1.8,-25,4,3,0x3c9eae);checkpoint(6,1.8,-25);coin(6,3.2,-25);platform(2,2.3,-31,3,3,0x6a82ce);coin(2,3.5,-31);platform(-2,2.8,-37,3,3,0x6b86d0);platform(-2,3.3,-43,4,4,0x419eae);checkpoint(-2,3.3,-43);coin(-2,4.7,-43);platform(3,3.8,-50,3,3,0x4b8fca);coin(3,5.1,-50);platform(7,4.3,-57,4,4,0x328dbd);platform(7,4.8,-64,6,6,0x329e8d);coin(7,6.2,-64);
for(let i=0;i<30;i++){let cl=new THREE.Mesh(new THREE.IcosahedronGeometry(.7+Math.random(),1),material(0xffffff));cl.position.set((Math.random()-.5)*42,7+Math.random()*15,-Math.random()*78);cl.scale.y=.45;scene.add(cl)}
const portal=new THREE.Mesh(new THREE.TorusGeometry(1.15,.18,12,36),new THREE.MeshStandardMaterial({color:0xa98aff,emissive:0x5422bb,emissiveIntensity:1.5}));portal.position.set(7,6.3,-64);scene.add(portal);
const player=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(.72,.9,.48),material(0x20d7b5));body.position.y=.95;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),material(0xffd3a5));head.position.y=1.65;player.add(head);let visor=new THREE.Mesh(new THREE.BoxGeometry(.48,.12,.08),material(0x173653));visor.position.set(0,1.7,-.29);player.add(visor);for(let x of [-.22,.22]){let l=new THREE.Mesh(new THREE.BoxGeometry(.2,.48,.23),material(0x244a83));l.position.set(x,.24,0);player.add(l)}scene.add(player);player.position.set(0,.25,1.4);
let cp=0,count=0,vy=0,onGround=false,started=false,won=false,mx=0,mz=0,jump=false,last=0;
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity=0,1200)}
function stats(){$('stats').innerHTML='COINS '+count+'<br>CHECKPOINT '+(cp||'—')}
const stick=$('stick'),nub=$('nub');let pid=null;function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=40;if(len>max){dx*=max/len;dy*=max/len}mx=dx/max;mz=dy/max;nub.style.left=(r.width/2-26+dx)+'px';nub.style.top=(r.height/2-26+dy)+'px'}
stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);stickMove(e)};stick.onpointermove=e=>{if(pid===e.pointerId)stickMove(e)};function release(e){if(pid===e.pointerId){pid=null;mx=mz=0;nub.style.left='35px';nub.style.top='35px'}}stick.onpointerup=release;stick.onpointercancel=release;$('jump').onpointerdown=e=>{e.preventDefault();jump=true};
function respawn(){let p=checkpoints[cp-1];player.position.set(p?p.x:0,(p?p.y:0)+.28,p?p.z:1.4);vy=0;toast('BACK TO CHECKPOINT')}
$('play').onclick=()=>{$('overlay').style.display='none';started=true;if(won){won=false;count=0;cp=0;coins.forEach(c=>{c.got=false;scene.add(c.m)});player.position.set(0,.25,1.4);stats()}toast('REACH THE PORTAL!')};
function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-last)/1000||.016,.035);last=t;if(started&&!won){let dx=-mx,dz=-mz,len=Math.hypot(dx,dz)||1;player.position.x+=dx/len*6*dt;player.position.z+=dz/len*6*dt;if(Math.abs(mx)+Math.abs(mz)>.1)player.rotation.y=Math.atan2(-mx,-mz);if(jump&&onGround){vy=8.2;onGround=false}jump=false;vy-=20*dt;player.position.y+=vy*dt;onGround=false;for(let p of platforms){if(player.position.x>p.x-p.w/2-.25&&player.position.x<p.x+p.w/2+.25&&player.position.z>p.z-p.d/2-.25&&player.position.z<p.z+p.d/2+.25&&vy<=0&&player.position.y>=p.y+.2&&player.position.y<=p.y+.75){player.position.y=p.y+.25;vy=0;onGround=true}}if(player.position.y< -12)respawn();for(let c of coins)if(!c.got){c.m.rotation.y+=dt*2;if(player.position.distanceTo(c.m.position)<1){c.got=true;scene.remove(c.m);count++;stats();toast('+1 COIN')}}checkpoints.forEach((c,i)=>{if(player.position.distanceTo(new THREE.Vector3(c.x,c.y+.4,c.z))<1.7&&cp<i+1){cp=i+1;stats();toast('CHECKPOINT SAVED')}});if(player.position.distanceTo(portal.position)<1.7){won=true;toast('OBBY COMPLETE!');setTimeout(()=>{$('overlay').style.display='grid';$('menu').querySelector('h1').textContent='YOU DID IT!';$('menu').querySelectorAll('p')[0].textContent='You cleared SkyHop! Coins collected: '+count;$('play').textContent='PLAY AGAIN'},900)}}
camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+3,player.position.z+7),.1);camera.lookAt(player.position.x,player.position.y+1,player.position.z-2.5);portal.rotation.z+=dt*.6;renderer.render(scene,camera)}
stats();requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
